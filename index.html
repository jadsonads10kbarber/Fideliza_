<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fideliza+ | Cartão Fidelidade Digital</title>
    <meta name="description" content="Seu cliente volta. Seu negócio cresce. Plataforma de cartão fidelidade digital para pequenos negócios." />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fideliza+" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="Fideliza+ | Cartão Fidelidade Digital" />
    <meta property="og:description" content="Seu cliente volta. Seu negócio cresce. Crie cartões fidelidade digitais para seus clientes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.svg" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('Service Worker registration skipped or failed:', err);
          });
        });
      }
    </script>
  </body>
